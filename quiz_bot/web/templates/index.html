<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Questions</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: var(--tg-theme-text-color, #000);
            background-color: var(--tg-theme-bg-color, #fff);
        }
        h1 {
            color: var(--tg-theme-text-color, #333);
        }
        p {
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            text-decoration: none;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Create Quiz Questions</h1>
    <p>Please return to the bot chat and use Telegram's native quiz poll feature (attachment icon -> Poll -> Quiz Mode) to add questions.</p>
    <button class="btn" onclick="closeWebApp()">Return to Chat</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function closeWebApp() {
            tg.close();
        }
    </script>
</body>
</html>
